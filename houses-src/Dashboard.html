<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waad Houses · Dashboard</title>
<style>
:root{--ink:#1b1d4c;--navy:#2A3077;--navy2:#3a43a3;--cyan:#1FC2F2;--mag:#E4007E;--org:#EF7A06;--green:#17733a;--red:#c81e3a;--bg:#f3f5fc;--card:#fff;--line:#dde2f3;--muted:#59609a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:160px}
header .me{font-size:13px;opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;background:#232a7a;padding:6px 10px}
nav button{flex:none;background:none;border:0;color:#cfd5ff;font:600 14px system-ui,sans-serif;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button[aria-current=true]{background:#fff;color:var(--navy)}
nav .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--mag);color:#fff;font-size:12px;margin-inline-start:4px}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(27,29,76,.06)}
.card.hl{outline:3px solid var(--cyan)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef1fb;color:var(--navy)}
.tag.pending{background:#fff4dc;color:#8a5a00}.tag.approved{background:#e3f7e8;color:var(--green)}.tag.rejected{background:#fde8ec;color:var(--red)}
.tag.race{background:#ffe9d6;color:#a54b00}.tag.fail{background:#fde8ec;color:var(--red)}
.q{font-weight:700;font-size:16px}
.txt{white-space:pre-wrap;background:#f7f8fe;border-radius:10px;padding:10px;margin:8px 0}
button.b{font:700 14px system-ui,sans-serif;border-radius:10px;border:0;padding:10px 14px;cursor:pointer;min-height:42px}
.b.ok{background:var(--green);color:#fff}.b.no{background:#fff;color:var(--red);border:2px solid var(--red)}.b.alt{background:#eef1fb;color:var(--navy)}
.b:disabled{opacity:.5;cursor:default}
select,input,textarea{font:inherit;padding:8px 10px;border:1px solid #c4cdf2;border-radius:10px;background:#fff;color:var(--ink);min-height:40px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.empty{text-align:center;padding:30px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;max-width:92vw;z-index:20;display:none}
#toast.bad{background:var(--red)}
.htag{display:inline-flex;align-items:center;gap:5px;color:#fff;font-weight:700;border-radius:99px;padding:2px 9px 2px 4px;font-size:13px}.htag svg{width:18px;height:18px}
.photo{max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.err{background:#fde8ec;color:var(--red);border-radius:12px;padding:14px;font-weight:600}
a{color:var(--navy2)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
</style>
</head>

function houseTag(h) { return HOUSE_COLOR[h] ? '<span class="htag" style="background:' + HOUSE_COLOR[h] + '"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#hm-' + h + '" fill="#fff"/></svg>' + esc(houseName(h)) + '</span>' : esc(houseName(h)); }
function fail(res) { toast(res.message || ('Error: ' + res.code), true); }

var TABS = [['pending', '⏳ To review'], ['approved', '✅ Approved'], ['rejected', '✖ Not approved'], ['points', '🏆 Points'], ['rewards', '🎁 Rewards'], ['vote', '🗳️ House vote'], ['admins', '👥 Admins'], ['health', '🩺 Health']];
function drawTabs() {
  $('#tabs').innerHTML = TABS.map(function (t) {
    var badge = t[0] === 'pending' && S.boot.counts.pending ? '<span class="badge">' + S.boot.counts.pending + '</span>' : '';
    return '<button data-tab="' + t[0] + '" aria-current="' + (S.tab === t[0]) + '">' + t[1] + badge + '</button>';
  }).join('');
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-tab]'); if (b) { S.tab = b.dataset.tab; drawTabs(); show(); return; }
  var a = e.target.closest('[data-do]'); if (a) act(a.dataset.do, a);
});

function boot() {
  call('adminBootstrap').then(function (res) {
    if (!res.ok) { $('#me').textContent = ''; $('#main').innerHTML = '<div class="err">' + esc(res.message || res.code) + '</div>'; return; }
    S.boot = res;
    $('#me').textContent = res.me.name + ' · ' + res.me.role;
    drawTabs(); show();
  });
}

function show() {
  var t = S.tab, m = $('#main');
  m.innerHTML = '<div class="empty">Loading…</div>';
  if (t === 'pending' || t === 'approved' || t === 'rejected') return listSubs(t);
  if (t === 'points') return points();
  if (t === 'rewards') return rewards();
  if (t === 'vote') return votes();
  if (t === 'admins') return admins();
  if (t === 'health') return health();
}

/* ---------- submissions ---------- */
function subCard(s, full) {
  var q = quest(s.questId), pend = s.status === 'pending';
  var who = { class: 'Whole class', group: 'A group', one: 'One student' }[s.who] || '';
  var actions = '';
  if (pend) {
    actions = '<div class="row" style="margin-top:8px">' +
      (q.maxPts ? '<label class="small">Points <input type="number" id="pts-' + esc(s.id) + '" min="1" max="' + q.maxPts + '" value="' + s.points + '" style="width:90px"></label>' : '') +
      '<button class="b ok" data-do="approve" data-id="' + esc(s.id) + '">✓ Approve +' + s.points + '</button>' +
      '<select id="why-' + esc(s.id) + '" aria-label="Reason">' + REASONS.map(function (r) { return '<option value="' + r[0] + '">' + esc(r[1]) + '</option>'; }).join('') + '</select>' +
      '<button class="b no" data-do="reject" data-id="' + esc(s.id) + '">✖ Not yet</button>' +
      '</div><input id="note-' + esc(s.id) + '" placeholder="Optional note for the class" style="width:100%;margin-top:8px" maxlength="300">';
  }
  return '<div class="card' + (s.id === OPEN_ID ? ' hl' : '') + '" id="c-' + esc(s.id) + '">' +
    '<div class="row"><span class="q grow">' + esc(q.icon) + ' ' + esc(q.en || s.questName) + ' <span class="muted">+' + s.points + '</span></span>' +
    '<span class="tag ' + esc(s.status) + '">' + esc(s.status) + '</span>' + (q.excl ? ' <span class="tag race">race</span>' : '') +
    (s.notifyStatus === 'failed' ? ' <span class="tag fail" title="' + esc(s.notifyError) + '">email failed</span>' : '') + '</div>' +
    '<div class="small muted">' + esc(cls(s.classId)) + ' · ' + houseTag(s.house) + ' · ' + esc(s.studentName ? s.studentName + ' (' + s.wa + ')' : s.wa) + ' · ' + esc(when(s.createdAt)) + ' · ' + esc(s.period) + '</div>' +
    '<div class="txt">' + esc(s.text) + '</div>' +
    '<div class="small muted">' + esc(who) + (s.names ? ': ' + esc(s.names) : '') + (s.hasPhoto ? ' · 📷 photo <button class="b alt" style="min-height:0;padding:4px 10px" data-do="photo" data-id="' + esc(s.id) + '">View</button>' : '') + '</div>' +
    '<div id="ph-' + esc(s.id) + '"></div>' +
    (!pend ? '<div class="small" style="margin-top:6px">' + (s.status === 'approved' ? '✅ Approved' : '✖ Not approved') + ' by ' + esc(s.decidedByName) + ' · ' + esc(when(s.decidedAt)) + (s.note ? ' · “' + esc(s.note) + '”' : '') + (s.reasonKey ? ' · ' + esc(s.reasonKey) : '') + '</div>' : '') +
    actions + '</div>';
}
function listSubs(status) {
  call('adminList', status, 200).then(function (res) {
    if (!res.ok) return fail(res);
    var items = res.items;
    if (status === 'pending') { S.boot.counts.pending = items.length; drawTabs(); }
    $('#main').innerHTML = items.length ? items.map(function (s) { return subCard(s); }).join('') :
      '<div class="empty">' + (status === 'pending' ? 'Nothing to review. 🎉' : 'Nothing here yet.') + '</div>';
    if (OPEN_ID) {
      var el = document.getElementById('c-' + OPEN_ID);
      if (el) el.scrollIntoView({ block: 'center' });
      else if (status === 'pending') openOne(OPEN_ID);
      OPEN_ID = '';
    }
  });
}
function openOne(id) {
  call('adminGet', id).then(function (res) {
    if (!res.ok) return fail(res);
    var s = res.item;
    $('#main').insertAdjacentHTML('afterbegin', '<div class="card hl"><b>From your email link:</b> this submission is already ' + esc(s.status) + '.</div>' + subCard(s));
  });
}

function act(what, el) {
  var id = el.dataset.id;
  if (what === 'photo') {
    el.disabled = true;
    return call('adminGet', id).then(function (res) {
      el.disabled = false;
      if (!res.ok) return fail(res);
      document.getElementById('ph-' + id).innerHTML = res.item.photo ? '<img class="photo" alt="Evidence photo" src="' + res.item.photo + '">' : '<span class="muted small">Photo unavailable.</span>';
    });
  }
  if (what === 'approve' || what === 'reject') {
    var card = document.getElementById('c-' + id);
    card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    var opts = { note: (document.getElementById('note-' + id) || {}).value || '', reasonKey: (document.getElementById('why-' + id) || {}).value || '' };
    var pts = document.getElementById('pts-' + id); if (pts) opts.points = Number(pts.value);
    return call('adminDecide', id, what, opts).then(function (res) {
      if (!res.ok) {
        fail(res);
        if (res.code === 'already' || res.code === 'taken' || res.code === 'duplicate') { card.remove(); refreshCount(-1); }
        else card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
        return;
      }
      toast(res.status === 'approved' ? '✓ Approved: +' + res.points + ' points added' + (res.closedOthers ? ' (' + res.closedOthers + ' other class submission' + (res.closedOthers > 1 ? 's' : '') + ' closed)' : '') : 'Marked “not yet”. The class will see your reason.');
      card.remove(); refreshCount(-1 - (res.closedOthers || 0));
      if (res.closedOthers) listSubs('pending');
    });
  }
  if (what === 'give') {
    var c = $('#g-class').value, p = Number($('#g-pts').value), r = $('#g-reason').value.trim();
    el.disabled = true;
    return call('adminGive', c, p, r).then(function (res) { el.disabled = false; if (!res.ok) return fail(res); toast((p > 0 ? '+' : '') + p + ' → ' + cls(c)); points(); });
  }
  if (what === 'undo') {
    if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to undo'; return; }
    return call('adminReverse', id, 'Undone from dashboard').then(function (res) { if (!res.ok) return fail(res); toast('Undone. The points no longer count.'); points(); });
  }
  if (what === 'vote') {
    var action = el.dataset.action, val = el.dataset.val || (document.getElementById('th-' + el.dataset.cls) || {}).value;
    if (action === 'clear' && el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to clear the house'; return; }
    el.disabled = true;
    return call('adminVote', el.dataset.cls, action, val).then(function (res) {
      el.disabled = false;
      if (!res.ok && res.code === 'below') { el.dataset.val = 'force'; el.textContent = 'Close anyway'; return toast(res.message, true); }
      if (!res.ok) return fail(res);
      if (action === 'close') toast('🎩 ' + houseName(res.winner) + ' wins (' + res.total + ' votes' + (res.tie.length ? ', tie broken at random' : '') + ')');
      votes();
    });
  }
  if (what === 'admin-save') {
    var a = { email: $('#a-email').value, name: $('#a-name').value, role: $('#a-role').value, notify: $('#a-notify').checked, active: true };
    el.disabled = true;
    return call('adminSaveAdmin', a).then(function (res) { el.disabled = false; if (!res.ok) return fail(res); toast('Saved.'); admins(); });
  }
  if (what === 'admin-toggle') {
    var item = JSON.parse(el.dataset.item); item[el.dataset.field] = !item[el.dataset.field];
    return call('adminSaveAdmin', item).then(function (res) { if (!res.ok) return fail(res); admins(); });
  }
  if (what === 'resend') { return call('adminResend', id).then(function (res) { if (!res.ok) return fail(res); toast('Result: ' + res.result); health(); }); }
}
function refreshCount(d) { S.boot.counts.pending = Math.max(0, S.boot.counts.pending + d); drawTabs(); if (!S.boot.counts.pending && S.tab === 'pending') $('#main').innerHTML = '<div class="empty">Nothing to review. 🎉</div>'; }

/* ---------- points ---------- */
function points() {
  call('adminPoints').then(function (res) {
    if (!res.ok) return fail(res);
    var opts = S.boot.classes.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('');
    $('#main').innerHTML =
      '<div class="card"><b>Give points or a penalty</b><div class="row" style="margin-top:8px">' +
      '<select id="g-class" aria-label="Class">' + opts + '</select>' +
      '<select id="g-pts" aria-label="Points">' + [10, 20, 30, 50, -5, -10, -20].map(function (v) { return '<option value="' + v + '">' + (v > 0 ? '+' : '') + v + '</option>'; }).join('') + '</select>' +
      '<input id="g-reason" class="grow" placeholder="Reason the class will see, e.g. Excellent teamwork" maxlength="80">' +
      '<button class="b ok" data-do="give">Save</button></div>' +
      '<div class="small muted" style="margin-top:6px">Approvers can give up to ' + S.boot.settings.allowanceTeacher + ' points per class per week. Totals never go below zero.</div></div>' +
      '<div class="grid2"><div class="card"><b>Classes</b><table><tr><th>Class</th><th>House</th><th>Total</th><th>This week</th></tr>' +
      res.classes.map(function (c) { return '<tr><td>' + esc(c.name) + '</td><td>' + houseTag(c.house) + '</td><td><b>' + c.total + '</b></td><td>' + c.week + '</td></tr>'; }).join('') + '</table></div>' +
      '<div class="card"><b>Houses</b><table><tr><th>House</th><th>Total</th></tr>' +
      res.houses.map(function (h) { return '<tr><td>' + houseTag(h.id) + '</td><td><b>' + h.total + '</b></td></tr>'; }).join('') + '</table></div></div>' +
      '<div class="card"><b>Recent points</b><table><tr><th>When</th><th>Class</th><th>Points</th><th>Reason</th><th>By</th><th></th></tr>' +
      res.recent.map(function (a) {
        return '<tr style="' + (a.reversed ? 'opacity:.45;text-decoration:line-through' : '') + '"><td class="small">' + esc(when(a.at)) + '</td><td>' + esc(cls(a.classId)) + '</td><td><b>' + (a.points > 0 ? '+' : '') + a.points + '</b> <span class="tag">' + esc(CLASS_KIND[a.kind] || a.kind) + '</span></td><td>' + esc(a.reason) + '</td><td class="small">' + esc(a.byName) + '</td><td>' +
          (a.reversed || !/owner|admin/.test(S.boot.me.role) ? '' : '<button class="b alt" data-do="undo" data-id="' + esc(a.id) + '">Undo</button>') + '</td></tr>';
      }).join('') + '</table></div>';
  });
}

/* ---------- rewards ---------- */
function rewards() {
  call('adminRewards').then(function (res) {
    if (!res.ok) return fail(res);
    var st = ['unlocked', 'approved', 'scheduled', 'redeemed'];
    $('#main').innerHTML = '<div class="card"><b>Unlocked rewards</b><p class="small muted">Unlocked → Approved → Scheduled → Redeemed. Each change records who made it. ⏳ = needs leadership approval first. 🔁 = a repeating reward (every 1,000 or 2,000 trophies); each time counts separately.</p>' +
      (res.items.length ? '<table><tr><th>Class</th><th>Reward</th><th>Status</th><th>Last change</th></tr>' + res.items.map(function (r) {
        return '<tr><td>' + esc(r.className) + '</td><td>' + esc(r.icon) + ' ' + esc(r.en) + (r.repeat ? ' 🔁' : '') + (r.approval ? ' ⏳' : '') + '</td><td><select data-claim="' + esc(r.classId) + '|' + esc(r.key) + '">' +
          st.map(function (s) { return '<option ' + (s === r.status ? 'selected' : '') + '>' + s + '</option>'; }).join('') + '</select></td><td class="small">' + esc(r.byName) + ' ' + esc(when(r.changedAt)) + '</td></tr>';
      }).join('') + '</table>' : '<div class="empty">No rewards unlocked yet.</div>') + '</div>';
  });
}
document.addEventListener('change', function (e) {
  var c = e.target.dataset && e.target.dataset.claim;
  if (c) { var i = c.indexOf('|'); call('adminSetClaim', c.slice(0, i), c.slice(i + 1), e.target.value).then(function (res) { if (!res.ok) return fail(res); toast('Saved.'); }); }
});

/* ---------- house vote ---------- */
function votes() {
  call('adminVotes').then(function (res) {
    if (!res.ok) return fail(res);
    $('#main').innerHTML = '<div class="card small muted"><b>Each class chooses its house together on its class screen</b>: one choice for the whole class, for the whole year. If a class chose by mistake, use <b>Clear house</b> and it can choose again.<br>Optional: a secret vote on the students\' own tablets (open it here, close it when enough have voted).</div>' +
      res.items.map(function (v) {
        var r = v.round, pct = v.boys ? Math.round(v.count / v.boys * 100) : 0;
        var th = r ? Math.round(r.threshold * 100) : Math.round(res.defaultThreshold * 100);
        var btns = (!r || r.status !== 'open')
          ? '<button class="b ok" data-do="vote" data-action="open" data-cls="' + esc(v.classId) + '" data-val="' + (th / 100) + '">Open vote</button>'
          : '<button class="b ok" data-do="vote" data-action="close" data-cls="' + esc(v.classId) + '">Close and pick the winner</button>' +
            '<select id="th-' + esc(v.classId) + '" aria-label="Threshold">' + [80, 85, 90].map(function (x) { return '<option value="' + (x / 100) + '" ' + (x === th ? 'selected' : '') + '>Needs ' + x + '%</option>'; }).join('') + '</select>' +
            '<button class="b alt" data-do="vote" data-action="threshold" data-cls="' + esc(v.classId) + '">Save %</button>';
        if (r) btns += '<button class="b alt" data-do="vote" data-action="reset" data-cls="' + esc(v.classId) + '">Reset round</button>';
        if (v.house) btns += '<button class="b no" data-do="vote" data-action="clear" data-cls="' + esc(v.classId) + '">Clear house</button>';
        return '<div class="card"><div class="row"><b class="grow">' + esc(v.name) + '</b><span class="tag">' + houseTag(v.house) + (v.houseMethod ? ' · ' + esc(v.houseMethod) : '') + '</span>' +
          (r ? '<span class="tag">' + esc(r.status) + ' · round ' + r.n + '</span>' : '<span class="tag">not started</span>') + '</div>' +
          (r && r.status === 'open' ? '<div class="small" style="margin:6px 0">' + v.count + ' of ' + v.boys + ' voted (' + pct + '%), needs ' + th + '%</div>' : '') +
          '<div class="row" style="margin-top:8px">' + btns + '</div></div>';
      }).join('');
  });
}

/* ---------- admins ---------- */
function admins() {
  call('adminAdmins').then(function (res) {
    if (!res.ok) return fail(res);
    var rows = res.items.map(function (a) {
      var item = esc(JSON.stringify(a));
      return '<tr><td>' + esc(a.name) + '<div class="small muted">' + esc(a.email) + '</div></td><td>' + esc(a.role) + '</td>' +
        '<td>' + (res.canEdit && a.role !== 'owner' ? '<button class="b alt" data-do="admin-toggle" data-field="notify" data-item="' + item + '">' + (a.notify ? '📧 On' : '— Off') + '</button>' : (a.notify ? '📧 On' : '— Off')) + '</td>' +
        '<td>' + (res.canEdit && a.role !== 'owner' ? '<button class="b alt" data-do="admin-toggle" data-field="active" data-item="' + item + '">' + (a.active ? 'Active' : 'Disabled') + '</button>' : (a.active ? 'Active' : 'Disabled')) + '</td></tr>';
    }).join('');
    $('#main').innerHTML = '<div class="card"><b>Administrators</b><p class="small muted">Approvers can review submissions and give points. Admins can also undo points, run house votes and manage rewards. Only the owner adds people.</p>' +
      '<table><tr><th>Name</th><th>Role</th><th>Emails</th><th>Status</th></tr>' + rows + '</table></div>' +
      (res.canEdit ? '<div class="card"><b>Add someone</b><div class="row" style="margin-top:8px"><input id="a-email" class="grow" placeholder="name@waadacademy.edu.sa" type="email"><input id="a-name" placeholder="Name shown to classes, e.g. Mr. Omar"><select id="a-role"><option value="approver">Approver</option><option value="admin">Admin</option></select><label class="small"><input type="checkbox" id="a-notify" checked> Email me submissions</label><button class="b ok" data-do="admin-save">Add</button></div></div>' : '');
  });
}

/* ---------- health ---------- */
function health() {
  call('adminHealth').then(function (res) {
    if (!res.ok) return fail(res);
    var ok = function (b) { return b ? '✅' : '⚠️'; };
    $('#main').innerHTML = '<div class="card"><b>System check</b><table>' +
      '<tr><td>' + ok(res.dashboardUrlSet) + ' Dashboard link in emails</td><td>' + (res.dashboardUrlSet ? 'Set' : 'Add dashboardUrl in the Settings tab') + '</td></tr>' +
      '<tr><td>' + ok(res.recipients > 0) + ' People who get emails</td><td>' + res.recipients + '</td></tr>' +
      '<tr><td>' + ok(res.emailQuotaLeft === null || res.emailQuotaLeft > 50) + ' Emails left today</td><td>' + (res.emailQuotaLeft === null ? 'unknown' : res.emailQuotaLeft) + '</td></tr>' +
      '<tr><td>' + ok(res.triggers.indexOf('retryNotifications') >= 0) + ' Automatic email retries</td><td>' + (res.triggers.indexOf('retryNotifications') >= 0 ? 'On' : 'Run installTriggers() once') + '</td></tr>' +
      '<tr><td>' + ok(res.students > 0) + ' Students in the Roster tab</td><td>' + res.students + '</td></tr>' +
      '<tr><td>Version</td><td>' + esc(res.version) + (res.schema && res.schema !== res.version ? ' (Sheet upgrade pending)' : '') + '</td></tr></table></div>' +
      '<div class="card"><b>Class screens</b><p class="small muted">Open screens update themselves to a new version within a few minutes, at a quiet moment. Screens not seen in the last 6 hours show as —.</p><table><tr><th>Class</th><th>Version</th><th>Last check</th></tr>' +
      (res.screens || []).map(function (c) {
        var cur = c.build === res.version;
        return '<tr><td>' + esc(c.name) + '</td><td>' + (c.build ? (cur ? '✅ ' : '⏳ ') + esc(c.build) : '—') + '</td><td class="small">' + (c.at ? esc(when(c.at)) : '') + '</td></tr>';
      }).join('') + '</table></div>' +
      '<div class="card"><b>Emails that failed</b>' + (res.failedEmails.length ? '<table>' + res.failedEmails.map(function (f) {
        return '<tr><td>' + esc(f.id) + '</td><td class="small">' + esc(f.error) + ' (' + f.tries + ' tries)</td><td><button class="b alt" data-do="resend" data-id="' + esc(f.id) + '">Send again</button></td></tr>';
      }).join('') + '</table>' : '<div class="empty">None.</div>') + '</div>';
  });
}

boot();
</script>
</body>
</html>
