<style>
/* Layout: a portrait game column (iPad / board) — HUD on top, one scene in the middle, a five-button dock at the bottom. Single bright game world, built on the Waad palette. */
:root{
  color-scheme: light;
  --ink:#1b1d4c; --navy:#2A3077; --navy-2:#3a43a3; --cyan:#1FC2F2; --sky:#7fdcff; --magenta:#E4007E; --orange:#EF7A06;
  --gold:#ffd23f; --gold-d:#f09d00; --green:#5be35b; --green-d:#1fa83c; --red:#ff4d5e; --red-d:#c81e3a;
  --paper:#f4f7ff; --paper-2:#dde6ff; --muted:#59609a; --line:#c4cdf2;
  --common:#8fa7c4; --rare:#ff9f1a; --epic:#b14dff; --legend:#ffcf2e;
  --game:"Lilita One","Lalezar",system-ui,sans-serif;
  --body:"Baloo 2","Baloo Bhaijaan 2",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root:lang(ar){ --game:"Lalezar","Lilita One",system-ui,sans-serif; --body:"Baloo Bhaijaan 2","Baloo 2",system-ui,sans-serif; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#141749;color:var(--ink);font:600 16px/1.35 var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden;
  background-image:radial-gradient(900px 600px at 50% 0%,#2f3aa8 0%,transparent 70%),repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 18px,transparent 18px 36px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* outlined game text */
.gt{font-family:var(--game);font-weight:400;color:#fff;letter-spacing:.01em;
  text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -1px 0 var(--ink),-2px -1px 0 var(--ink),0 -2px 0 var(--ink)}
.gt.sm{text-shadow:0 2px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink)}

#app{position:relative;height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#5fd0ff 0%,#2b8fe0 55%,#2457c2 100%);overflow:hidden;box-shadow:0 0 0 3px var(--ink),0 0 80px rgba(0,0,0,.5)}
@media (min-width:700px){#app{border-radius:0}}

/* ---------- HUD ---------- */
.hud{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(#2c3592,#232a7a);border-bottom:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25);z-index:5}
.hud-id{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.hud-id .nm{font-size:1.15rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-id .hs{font-size:.8rem;color:#c9d2ff;font-weight:700;white-space:nowrap}
.pill{position:relative;display:flex;align-items:center;height:36px;padding-inline:34px 12px;border-radius:12px;background:#151850;border:3px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(255,255,255,.08);font-size:1.15rem}
.pill .ic{position:absolute;inset-inline-start:-8px;top:50%;transform:translateY(-50%);font-size:1.7rem;filter:drop-shadow(0 2px 0 var(--ink))}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:linear-gradient(#e9eeff,#b9c6f5);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* ---------- screens ---------- */
#screen{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.pad{padding:14px 14px 24px;display:grid;gap:14px}

/* ---------- dock ---------- */
.dock{flex:none;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:4px;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);background:linear-gradient(#2c3592,#1c2268);border-top:3px solid var(--ink);z-index:5}
.dk{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:14px;transition:transform .15s}
.dk .di{font-size:2rem;line-height:1;filter:drop-shadow(0 3px 0 var(--ink))}
.dk .dl{font-size:.82rem}
.dk[aria-current="true"]{background:linear-gradient(#5a69e8,#3a45bf);box-shadow:inset 0 0 0 3px var(--ink),0 0 0 2px rgba(255,255,255,.25);transform:translateY(-6px)}
.dk.home .di{font-size:2.6rem}
.dk .dot{position:absolute;top:0;inset-inline-end:16%;width:18px;height:18px;border-radius:50%;background:var(--red);border:2px solid var(--ink);color:#fff;font:400 .7rem/14px var(--game);text-align:center}

/* ---------- panels + buttons ---------- */
.panel{position:relative;background:linear-gradient(#ffffff,#e8eeff);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(27,29,76,.6);padding:14px;min-width:0}
.ph{margin:-14px -14px 12px;padding:9px 14px;border-radius:15px 15px 0 0;background:linear-gradient(#4b56d8,#3540b2);border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:8px}
.ph .gt{font-size:1.2rem}
.ph.mag{background:linear-gradient(#ff3fa4,#d0006f)}
.ph.org{background:linear-gradient(#ffa13a,#e46c00)}
.ph.grn{background:linear-gradient(#4fdc6d,#1f9f40)}
.gbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--game);font-size:1.25rem;color:#fff;padding:.5em 1.1em;border-radius:14px;border:3px solid var(--ink);
  text-shadow:0 2px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink);
  background:linear-gradient(#ffe06a,#ffb800);box-shadow:inset 0 -6px 0 rgba(0,0,0,.16),inset 0 3px 0 rgba(255,255,255,.6),0 5px 0 var(--ink);transition:transform .08s}
.gbtn:active{transform:translateY(4px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 var(--ink)}
.gbtn.green{background:linear-gradient(#7af07a,#25b347)}
.gbtn.blue{background:linear-gradient(#6fd7ff,#1d8fe3)}
.gbtn.red{background:linear-gradient(#ff7a86,#e0213d)}
.gbtn.white{background:linear-gradient(#ffffff,#c9d4f7);color:var(--ink);text-shadow:none}
.gbtn.big{font-size:1.7rem;padding:.45em 1.4em;border-radius:18px}
.gbtn:disabled{filter:grayscale(.85) brightness(.9);cursor:not-allowed}
.gbtn.shine{overflow:hidden}
.gbtn.shine::after{content:"";position:absolute;inset:-2px;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-120%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{55%,100%{transform:translateX(120%)}}
.seg{display:flex;background:#151850;border:3px solid var(--ink);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 6px;border-radius:10px;font-family:var(--game);color:#b9c2f5;font-size:1rem}
.seg button[aria-pressed="true"]{background:linear-gradient(#ffe06a,#ffb800);color:#fff;text-shadow:0 2px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font:400 .85rem var(--game);border:2px solid var(--ink);color:#fff;text-shadow:0 1px 0 var(--ink)}

/* ---------- login ---------- */
.login{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 18px;text-align:center;overflow:auto}
.login .logo{font-size:clamp(2.6rem,10vw,4.2rem);line-height:.92;transform:rotate(-3deg)}
.login .logo span{display:block;color:var(--gold)}
.login .tagline{font-size:1.05rem}
.crest-ring{display:flex;gap:10px;justify-content:center}
.crest-ring svg{filter:drop-shadow(0 4px 0 var(--ink))}
.login-card{width:min(100%,420px);display:grid;gap:12px}
.wa{display:flex;align-items:stretch;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff;box-shadow:inset 0 4px 0 rgba(0,0,0,.08)}
.wa b{display:grid;place-items:center;padding-inline:14px;background:var(--paper-2);font:400 1.6rem var(--game);color:var(--navy);border-inline-end:3px solid var(--ink)}
.wa input{flex:1;min-width:0;border:0;font:400 1.9rem var(--game);color:var(--ink);padding:10px 12px;letter-spacing:.08em;background:transparent;text-align:start}
.wa input:focus{outline:none}
.err{background:#fff0f2;border:3px solid var(--red-d);color:#8a0f25;border-radius:12px;padding:8px 12px;font-weight:700}
.linkbtn{color:#fff;text-decoration:underline;font-weight:800;text-shadow:0 2px 0 var(--ink)}
.langsw{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:12px;display:flex;gap:6px}
.langsw button{padding:6px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;font:400 1rem var(--game);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.langsw button[aria-pressed="true"]{background:linear-gradient(#ffe06a,#ffb800)}

/* ---------- home scene ---------- */
.scene{position:relative;height:clamp(330px,52vh,470px);overflow:hidden;background:linear-gradient(#58cfff 0%,#a8e9ff 62%,#ffe2a8 100%);border-bottom:3px solid var(--ink)}
.sun{position:absolute;top:22px;inset-inline-end:34px;width:70px;height:70px;border-radius:50%;background:radial-gradient(#fff9d6,#ffd84f 60%,rgba(255,216,79,0));filter:blur(.5px)}
.cloud{position:absolute;height:26px;border-radius:30px;background:#fff;opacity:.95;box-shadow:18px -12px 0 6px #fff,40px -4px 0 2px #fff;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(760px)}}
.dunes{position:absolute;inset-inline:0;bottom:0;width:100%;height:45%}
.rays{position:absolute;left:50%;top:44%;width:620px;height:620px;margin:-310px 0 0 -310px;background:repeating-conic-gradient(rgba(255,255,255,.38) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 6%,transparent 62%);mask:radial-gradient(circle,#000 6%,transparent 62%);animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pedestal{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.pedestal .crest-big{animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(27,29,76,.35));cursor:pointer}
@keyframes bob{50%{transform:translateY(-10px)}}
.plinth{width:190px;height:34px;margin-top:-6px;border-radius:50%;background:radial-gradient(#ffe9a8,#e0a440 70%);border:3px solid var(--ink);box-shadow:0 8px 0 #a8681c,0 8px 0 3px var(--ink)}
.ribbon{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:8px 34px;background:linear-gradient(#ff3fa4,#d0006f);border:3px solid var(--ink);border-radius:8px;white-space:nowrap;box-shadow:0 5px 0 rgba(27,29,76,.5)}
.ribbon .gt{font-size:clamp(1.3rem,5vw,1.8rem)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:10px;width:26px;height:100%;background:#a8005a;border:3px solid var(--ink);z-index:-1}
.ribbon::before{left:-18px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
.ribbon::after{right:-18px;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
.house-chip{position:absolute;left:50%;top:70px;transform:translateX(-50%);white-space:nowrap}
.trophy-big{position:absolute;inset-inline-start:14px;bottom:14px;display:flex;align-items:center;gap:6px}
.trophy-big .n{font-size:2.2rem;line-height:1}
.home-body{padding:14px;display:grid;gap:14px}
.xp{position:relative;height:38px;border-radius:14px;background:#151850;border:3px solid var(--ink);overflow:hidden}
.xp i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(#ffe36e,#ffb300);border-inline-end:3px solid var(--ink);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 10px,transparent 10px 20px),linear-gradient(#ffe36e,#ffb300);background-size:28px 28px,100% 100%;animation:stripes 1s linear infinite;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes stripes{to{background-position:28px 0,0 0}}
.xp .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:1.1rem}
.next-row{display:flex;align-items:center;gap:12px}
.chest{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:2.1rem;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-8deg)}88%{transform:rotate(8deg)}92%{transform:rotate(-5deg)}96%{transform:rotate(4deg)}}
.remind{display:flex;align-items:center;gap:10px;background:linear-gradient(#fff6c9,#ffe38a);border:3px solid var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 rgba(27,29,76,.5);font-weight:800}
.remind svg{flex:none}
.feed{display:grid;gap:8px}
.fi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#fff;border:2px solid var(--line)}
.fi .p{font:400 1.25rem var(--game);min-width:58px;text-align:center;border-radius:10px;padding:2px 6px;color:#fff;border:2px solid var(--ink);background:var(--green-d);text-shadow:0 1px 0 var(--ink)}
.fi .p.neg{background:var(--red-d)}
.fi .p.q{background:var(--magenta)}
.fi .t{flex:1;min-width:0;font-weight:700}
.fi .t small{display:block;color:var(--muted);font-weight:600}

/* ---------- trophy road ---------- */
.road-head{position:sticky;top:0;z-index:3;padding:10px 14px;background:linear-gradient(#2c3592,#252d86);border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:10px}
.road{position:relative;padding:24px 10px 40px}
.track{position:absolute;top:24px;bottom:40px;left:50%;width:22px;margin-left:-11px;border-radius:12px;background:#1a1e5c;border:3px solid var(--ink);overflow:hidden}
.track i{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(90deg,#ffb300,#ffe36e,#ffb300);box-shadow:0 0 18px #ffd23f}
.rlist{position:relative;display:flex;flex-direction:column-reverse;gap:6px}
.rnode{display:grid;grid-template-columns:1fr 74px 1fr;align-items:center;min-height:126px}
.rnum{grid-column:2;justify-self:center;z-index:1;min-width:64px;padding:4px 8px;border-radius:12px;text-align:center;font:400 1rem var(--game);color:#fff;background:#3a43a3;border:3px solid var(--ink);text-shadow:0 2px 0 var(--ink)}
.rnode.got .rnum{background:linear-gradient(#ffe36e,#ffb300)}
.rcard{position:relative;width:100%;max-width:200px;justify-self:end;border-radius:16px;padding:10px 10px 12px;text-align:center;border:3px solid var(--ink);background:linear-gradient(#ffffff,#e4ebff);box-shadow:0 5px 0 var(--ink),inset 0 0 0 4px var(--rar,var(--common));cursor:pointer}
.rnode.right .rcard{grid-column:3;justify-self:start}
.rnode.left .rcard{grid-column:1;grid-row:1}
.rnode.left .rnum{grid-row:1}
.rcard .ri{font-size:2.4rem;line-height:1.1}
.rcard .rn{font-weight:800;font-size:.92rem;line-height:1.15;margin-top:4px}
.rcard .rt{margin-top:6px}
.rcard.locked{filter:saturate(.25) brightness(.92)}
.rcard.locked::after{content:"🔒";position:absolute;top:-12px;inset-inline-end:-10px;font-size:1.5rem;filter:drop-shadow(0 2px 0 var(--ink))}
.rcard.next{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 var(--ink),inset 0 0 0 4px var(--rar),0 0 0 8px rgba(255,210,63,.55)}}
.rcard.legendary{background:linear-gradient(#fff6d6,#ffe08a)}
.rcard.legendary::before{content:"";position:absolute;inset:-6px;border-radius:20px;z-index:-1;background:conic-gradient(#ff4d5e,#ffd23f,#5be35b,#1FC2F2,#b14dff,#ff4d5e);animation:spin 4s linear infinite;filter:blur(2px)}
.rstate{position:absolute;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap}
.marker{position:absolute;left:50%;z-index:2;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.marker svg{animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 0 var(--ink))}
.marker .you{margin-top:-4px}
.rstart{display:grid;place-items:center;padding-top:6px}

/* ---------- quests ---------- */
.qcard{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:16px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 rgba(27,29,76,.55)}
.qicon{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:1.9rem;background:linear-gradient(#e8eeff,#c6d2fb);border:3px solid var(--ink)}
.qt{min-width:0}
.qt b{display:block;font-size:1.02rem;line-height:1.15}
.qt small{display:block;color:var(--muted);font-weight:600;line-height:1.25;margin-top:2px}
.qrw{font:400 1.15rem var(--game);color:#fff;text-align:center;background:linear-gradient(#ffe06a,#ffb800);border:3px solid var(--ink);border-radius:12px;padding:4px 8px;text-shadow:0 2px 0 var(--ink)}
.qact{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;align-items:center}
.qcard.done{background:linear-gradient(#eaffea,#c9f5cf)}
.qcard.wait{background:linear-gradient(#fff9e6,#ffeeb8)}

/* ---------- badges ---------- */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.medal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 4px;border-radius:16px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 rgba(27,29,76,.5)}
.medal .m{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:radial-gradient(circle at 35% 30%,#fff4c4,#ffc928 60%,#d88a00);border:3px solid var(--ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.medal.off .m{background:radial-gradient(circle at 35% 30%,#f1f3fb,#b8bfdc 60%,#8890b5);filter:grayscale(1)}
.medal .bn{font-weight:800;font-size:.85rem;line-height:1.1}
.medal .bp{width:80%;height:8px;border-radius:6px;background:#e1e6fb;border:2px solid var(--ink);overflow:hidden}
.medal .bp i{display:block;height:100%;background:var(--green-d)}

/* ---------- ranks ---------- */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;padding-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;border:3px solid var(--ink);display:grid;place-items:center;font:400 2rem var(--game);color:#fff;text-shadow:0 3px 0 var(--ink)}
.pod.p1 .blk{height:110px;background:linear-gradient(#ffe36e,#ffb300)}
.pod.p2 .blk{height:82px;background:linear-gradient(#eef2ff,#aab6e3)}
.pod.p3 .blk{height:64px;background:linear-gradient(#ffc08a,#d9772e)}
.pod .pn{font-weight:800;font-size:.92rem;line-height:1.1}
.rrow{display:grid;grid-template-columns:40px 36px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 rgba(27,29,76,.45)}
.rrow.me{background:linear-gradient(#fff6c9,#ffe38a)}
.rrow .rk{font:400 1.4rem var(--game);color:var(--navy);text-align:center}
.rrow .rv{font:400 1.3rem var(--game);color:var(--navy)}
.rrow small{display:block;color:var(--muted);font-weight:600}

/* ---------- popups ---------- */
.pop{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(10,12,40,.62)}
.pop .panel{width:min(100%,420px);text-align:center;padding-top:22px}
.xbtn{position:absolute;top:-14px;inset-inline-end:-14px;width:42px;height:42px;border-radius:50%;background:linear-gradient(#ff7a86,#e0213d);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:#fff;font:400 1.3rem var(--game);text-shadow:0 2px 0 var(--ink)}
.bigicon{font-size:4rem;line-height:1;filter:drop-shadow(0 4px 0 rgba(27,29,76,.35))}
.pop h2{font-size:1.7rem;margin:8px 0 4px}
.toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,460px);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-weight:800;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.toast .tp{font:400 1.5rem var(--game);color:var(--green-d)}
.toast.bad .tp{color:var(--red-d)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}

/* ---------- tutorial ---------- */
.tut{position:fixed;inset:0;z-index:50}
.tut .shade{position:absolute;inset:0;background:rgba(8,10,36,.72);transition:clip-path .25s}
.tut .ring{position:absolute;border-radius:18px;border:4px solid var(--gold);box-shadow:0 0 0 6px rgba(255,210,63,.35),0 0 30px rgba(255,210,63,.8);pointer-events:none;animation:ringpulse 1.2s ease-in-out infinite}
@keyframes ringpulse{50%{box-shadow:0 0 0 12px rgba(255,210,63,.15),0 0 40px rgba(255,210,63,.9)}}
.tut .hand{position:absolute;width:74px;height:74px;pointer-events:none;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35));animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translate(0,0) scale(1)}45%{transform:translate(-6px,-10px) scale(1.05)}60%{transform:translate(0,0) scale(.92)}}
.tut .say{position:absolute;inset-inline:12px;display:flex;align-items:flex-end;gap:8px;max-width:560px;margin:0 auto}
.tut .say .bub{flex:1;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:1.12rem;line-height:1.3}
.tut .say .bub .gbtn{margin-top:10px}
.tut .banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;width:92%;font-size:clamp(2rem,8vw,3.2rem);line-height:1}
.picker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctile{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:800;text-align:start}
.ctile.mine{background:linear-gradient(#fff6c9,#ffe38a)}

/* ---------- staff ---------- */
.staffbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 12px;background:#20276f;border-bottom:3px solid var(--ink)}
.staffbar::-webkit-scrollbar{display:none}
.staffbar button{flex:none;padding:7px 12px;border-radius:12px;font:400 1rem var(--game);color:#c9d2ff;border:3px solid transparent}
.staffbar button[aria-current="true"]{background:linear-gradient(#ffe06a,#ffb800);color:#fff;border-color:var(--ink);text-shadow:0 2px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:12px;background:#fff;border:3px solid var(--ink);font-weight:800;box-shadow:0 3px 0 var(--ink);font-size:.92rem}
.chip[aria-pressed="true"]{background:linear-gradient(#ffe06a,#ffb800)}
.chip.neg[aria-pressed="true"]{background:linear-gradient(#ff9aa4,#ff4d5e);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pbtn{padding:12px 0;border-radius:14px;font:400 1.5rem var(--game);color:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);text-shadow:0 2px 0 var(--ink);background:linear-gradient(#7af07a,#25b347)}
.pbtn.neg{background:linear-gradient(#ff7a86,#e0213d)}
.pbtn[aria-pressed="true"]{outline:4px solid var(--gold);outline-offset:2px}
.pbtn:disabled{filter:grayscale(.9);opacity:.6}
.field{display:grid;gap:6px}
.field label{font-weight:800;font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:520px}
.tbl td,.tbl th{padding:6px 8px;text-align:start;vertical-align:middle}
.tbl th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tbl tr.r td{background:#fff;border-block:2px solid var(--line)}
.tbl tr.r td:first-child{border-inline-start:2px solid var(--line);border-radius:12px 0 0 12px}
.tbl tr.r td:last-child{border-inline-end:2px solid var(--line);border-radius:0 12px 12px 0}
.scroll-x{overflow-x:auto}
.inp,select.inp{width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--ink);font:inherit;background:#fff;color:var(--ink);min-width:0}
.note{background:#e8f6ff;border:2px solid #7ac3ee;border-radius:12px;padding:8px 12px;font-weight:600}

/* ---------- stage (House Decider) ---------- */
.stage{position:fixed;inset:0;z-index:45;background:radial-gradient(900px 700px at 50% 30%,#3a44b8 0%,#141749 70%);display:flex;flex-direction:column;overflow:auto}
.stage-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px}
.stage-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px 14px 18px;text-align:center}
.bubble{max-width:min(94vw,900px);min-height:2.4em;font-size:clamp(1.3rem,3.6vw,2.6rem);line-height:1.15}
#hat{width:clamp(190px,30vh,300px);height:auto;animation:bob 3s ease-in-out infinite}
#hat.talk #mouth{animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
#mouth{transform-origin:150px 214px;transform:scaleY(.3)}
.carousel{display:flex;gap:clamp(10px,2.4vw,26px);justify-content:center;flex-wrap:wrap;margin-block:8px 36px}
.c-item{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.45;transition:transform .18s,opacity .18s,filter .18s}
.c-item.hot{opacity:1;filter:none;transform:scale(1.18)}
.c-item.win{opacity:1;filter:none;transform:scale(1.45)}
.c-item.lose{opacity:.15}
.c-item .wr{position:absolute;left:50%;top:42%;width:520px;height:520px;margin:-260px 0 0 -260px;z-index:-1;background:repeating-conic-gradient(var(--hc) 0 6deg,transparent 6deg 18deg);opacity:.5;-webkit-mask:radial-gradient(circle,#000 8%,transparent 64%);mask:radial-gradient(circle,#000 8%,transparent 64%);animation:spin 14s linear infinite}
.reveal{font-size:clamp(3rem,11vw,7.5rem);line-height:.95}


/* ---- polish: Supercell-style home hub ---- */
.scene.tall{height:max(400px,calc(100% - 200px))}
.side{position:absolute;top:118px;display:flex;flex-direction:column;align-items:center;gap:2px;width:74px;padding:8px 0 6px;border-radius:18px;background:linear-gradient(#5a69e8,#3540b2);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.3);animation:bob 3.4s ease-in-out infinite}
.side .si{font-size:2rem;line-height:1;filter:drop-shadow(0 3px 0 var(--ink))}
.side .gt{font-size:1.05rem}
.side.l{inset-inline-start:12px}
.side.r{inset-inline-end:12px;animation-delay:-1.7s}
.side:active{transform:translateY(4px)}
.hatnote{position:absolute;inset-inline-end:10px;bottom:10px;display:flex;align-items:flex-end;gap:4px;max-width:58%;cursor:pointer}
.hatnote span{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;font-weight:800;font-size:.92rem;line-height:1.2;box-shadow:0 4px 0 var(--ink)}
.nextbox{display:flex;align-items:center;gap:12px}
.nextbox .nm{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextbox .xp{margin-top:6px}
.cta{display:flex;justify-content:center}
.cta .gbtn{width:100%;font-size:1.9rem;padding:.4em 0}
.qcard2{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:18px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 rgba(27,29,76,.55)}
.qcard2.done{background:linear-gradient(#eaffea,#c9f5cf)}
.qcard2.wait{background:linear-gradient(#fff9e6,#ffeeb8)}
.qcard2 .qicon{width:60px;height:60px;font-size:2.1rem}
.qcard2 .qn{text-align:start;font-weight:800;font-size:1.05rem;line-height:1.15}
.qcard2 .qn small{display:block;margin-top:4px}
.qside{display:flex;flex-direction:column;align-items:center;gap:6px}
.qside .gbtn{font-size:1.5rem;padding:.25em .7em}
.cad{display:inline-block;padding:1px 8px;border-radius:999px;font:400 .78rem var(--game);color:#fff;border:2px solid var(--ink);text-shadow:0 1px 0 var(--ink)}
.cad-daily{background:#1d8fe3}.cad-weekly{background:#25b347}.cad-monthly{background:#b14dff}.cad-special{background:var(--magenta)}
.hatline{display:flex;align-items:flex-end;gap:6px}
.hatline span{flex:1;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.backhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(#2c3592,#252d86);border-bottom:3px solid var(--ink)}
.backhead .gt{font-size:1.4rem;flex:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;border-radius:18px;background:linear-gradient(#ffffff,#dfe7ff);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.tile .ti{font-size:2.4rem;line-height:1;filter:drop-shadow(0 3px 0 rgba(27,29,76,.3))}
.tile .gt{color:var(--navy);text-shadow:none;font-size:1.1rem}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.rcard .rn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- v5: intro cutscene, school backdrop, welcome, announcements ---- */
.intro{position:fixed;inset:0;z-index:90;background:#3fb8ff;overflow:hidden;cursor:pointer}
.intro .school-art{position:absolute;inset:0;width:100%;height:100%}
.intro .ilogo{position:absolute;left:0;right:0;top:50%;margin:0;transform:translateY(-50%) rotate(-3deg);text-align:center;font-size:clamp(3rem,13vw,6rem);line-height:.9;pointer-events:none}
.intro .ilogo span{display:block;color:var(--gold)}
.intro .skip{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);inset-inline-end:18px;font-size:1rem;padding:.35em .9em}
.intro .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.login{justify-content:flex-start;padding-bottom:0;background:linear-gradient(#3fb8ff 0%,#8fdcff 70%,#c8f1ff 100%)}
.login-main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-top:44px}
.login-school{flex:none;width:calc(100% + 36px);margin:0 -18px;aspect-ratio:10/7;max-height:36vh;position:relative}
.login-school .school-art{position:absolute;inset:0;width:100%;height:100%}
.school-art .s-cl{animation:cldrift 9s ease-in-out infinite alternate}
.school-art .s-cl.b{animation-duration:12s;animation-delay:-4s}
.school-art .s-cl.c{animation-duration:7s;animation-delay:-2s}
@keyframes cldrift{to{transform:translateX(46px)}}
.school-art .s-flag{transform-box:fill-box;transform-origin:left center;animation:flag 1.4s ease-in-out infinite alternate}
@keyframes flag{to{transform:skewY(-6deg) scaleX(.94)}}
.login .s-glint{animation:glint 5s ease-in-out infinite}
@keyframes glint{0%,60%{transform:translateX(-260px)}85%,100%{transform:translateX(420px)}}
.welcome{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:radial-gradient(circle,rgba(36,42,140,.92),rgba(14,16,52,.97));pointer-events:none;text-align:center}
.welcome .wcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 16px}
.welcome .wt{font-size:clamp(2.2rem,9vw,3.6rem);line-height:1}
.welcome .ws{font-size:1.2rem}
.welcome .wr{position:absolute;left:50%;top:50%;width:700px;height:700px;margin:-350px 0 0 -350px;z-index:-1;background:repeating-conic-gradient(var(--hc,#ffd23f) 0 7deg,transparent 7deg 20deg);opacity:.35;-webkit-mask:radial-gradient(circle,#000 6%,transparent 60%);mask:radial-gradient(circle,#000 6%,transparent 60%);animation:spin 12s linear infinite}
.announce{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);z-index:35;width:min(92vw,440px);pointer-events:none}
.announce .panel{pointer-events:auto;display:grid;gap:8px;padding-top:12px}
.announce .an-h{display:flex;align-items:center;gap:8px;font:400 1.15rem var(--game);color:var(--magenta)}
.announce .an-row{display:flex;align-items:center;gap:10px;font-weight:800;line-height:1.2}
.announce .an-row .p{font:400 1.2rem var(--game);color:#fff;background:var(--green-d);border:2px solid var(--ink);border-radius:10px;padding:2px 8px;text-shadow:0 1px 0 var(--ink);flex:none}
.announce .an-row small{display:block;color:var(--muted);font-weight:600}
.announce .gbtn{justify-self:stretch;font-size:1.5rem}
.qsec{display:flex;align-items:center;gap:8px;margin-top:6px}
.qsec .gt{font-size:1.35rem}
.qsec small{color:#fff;font-weight:800;opacity:.9;text-shadow:0 1px 0 var(--ink)}
.qcard2.taken{background:linear-gradient(#eceffa,#d5dbef)}
.qcard2.taken .qicon{filter:grayscale(.8)}
.qtaken{font-size:.8rem;color:var(--muted);font-weight:800}
.cad-special{background:var(--magenta)}
.cad-race{background:#ff6a00}
.oth{position:absolute;z-index:0;display:flex;align-items:center;gap:3px;transform:translate(-50%,-50%);pointer-events:none;transition:top .9s cubic-bezier(.2,.8,.2,1)}
.oth svg{filter:drop-shadow(0 2px 0 var(--ink))}
.oth .tag{font-size:.72rem;padding:1px 6px}
.road-head .iconbtn{width:40px;height:40px;font-size:1.2rem}
.rs-pipe{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0}
.rs-pipe span{padding:2px 8px;border-radius:999px;font:400 .8rem var(--game);border:2px solid var(--ink);background:#e1e6fb;color:var(--muted)}
.rs-pipe span.on{background:var(--green-d);color:#fff;text-shadow:0 1px 0 var(--ink)}
/* ---- v5: house cards + voting ---- */
.vote-cta{animation:pulse2 1.4s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.04)}}
.hcards{display:grid;grid-template-columns:1fr 1fr;gap:16px;perspective:900px}
.hcard{display:block;width:100%;position:relative;isolation:isolate;aspect-ratio:5/7;border-radius:22px;cursor:pointer;transform-style:preserve-3d;transition:transform .25s cubic-bezier(.2,1.4,.4,1);animation:float 4s ease-in-out infinite}
.hcard:nth-child(2){animation-delay:-1s}.hcard:nth-child(3){animation-delay:-2s}.hcard:nth-child(4){animation-delay:-3s}
@keyframes float{50%{transform:translateY(-6px) rotateX(4deg)}}
.hcard .hc-aura{position:absolute;inset:-14%;z-index:-1;border-radius:50%;background:repeating-conic-gradient(var(--hc) 0 8deg,transparent 8deg 22deg);opacity:.0;-webkit-mask:radial-gradient(circle,#000 20%,transparent 66%);mask:radial-gradient(circle,#000 20%,transparent 66%);animation:spin 10s linear infinite;transition:opacity .3s}
.hcard .hc-f{position:absolute;inset:0;border-radius:22px;overflow:hidden;border:4px solid var(--ink);background:radial-gradient(90% 60% at 50% 38%,var(--hc2) 0%,var(--hc3) 55%,#141749 100%);box-shadow:0 7px 0 var(--ink),inset 0 0 0 5px rgba(255,255,255,.35),inset 0 0 0 9px var(--hc3)}
.hcard .hc-gem{position:absolute;top:10px;inset-inline-start:10px;width:34px;height:34px;transform:rotate(45deg);border-radius:8px;background:linear-gradient(135deg,#fff,var(--hc));border:3px solid var(--ink)}
.hcard .hc-art{position:absolute;inset:8% 0 30%;display:grid;place-items:center}
.hcard .hc-art svg{width:56%;height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)) drop-shadow(0 0 16px rgba(255,255,255,.6));animation:bob 2.6s ease-in-out infinite}
.hcard .hc-ray{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,255,255,.22) 0 6deg,transparent 6deg 18deg);animation:spin 18s linear infinite;-webkit-mask:radial-gradient(circle at 50% 42%,#000 10%,transparent 55%);mask:radial-gradient(circle at 50% 42%,#000 10%,transparent 55%)}
.hcard .hc-shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);transform:translateX(-120%);animation:shine 3.4s ease-in-out infinite}
.hcard .hc-p{position:absolute;bottom:28%;width:7px;height:7px;border-radius:2px;background:#fff;transform:rotate(45deg);opacity:0;animation:rise 2.8s linear infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0) rotate(45deg) scale(.6)}20%{opacity:.9}100%{opacity:0;transform:translateY(-150px) rotate(225deg) scale(1)}}
.hcard .hc-name{position:absolute;left:6%;right:6%;bottom:13%;padding:5px 0;text-align:center;font-size:clamp(1.1rem,4.6vw,1.6rem);border-radius:10px;background:linear-gradient(#ffe06a,#ffb800);border:3px solid var(--ink)}
.hcard .hc-v{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-weight:800;color:#fff;font-size:.9rem;text-shadow:0 2px 0 var(--ink)}
.hcard.sel{transform:translateY(-12px) scale(1.06) rotateX(6deg);animation:none;z-index:2}
.hcard.sel .hc-aura{opacity:.75}
.hcard.sel .hc-f{box-shadow:0 7px 0 var(--ink),inset 0 0 0 5px #fff,0 0 0 5px var(--gold),0 0 40px var(--gold)}
.hcards.has-sel .hcard:not(.sel){opacity:.62;transform:scale(.96)}
.vbar{display:grid;gap:6px}
.vbar .xp i{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 10px,transparent 10px 20px),linear-gradient(#7af07a,#25b347)}
.vbar .tick{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--ink);border-radius:2px}
.vsecret{display:flex;align-items:center;gap:8px;justify-content:center;text-align:center;font-weight:800;color:#fff;text-shadow:0 2px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---- v6: music button, offline bar, quest sheet + form, install, accessibility ---- */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.musicbtn{position:relative}
.musicbtn.playing{background:linear-gradient(#7af07a,#25b347)}
.musicbtn.waiting{animation:pulse2 1.4s ease-in-out infinite}
.eq{display:flex;align-items:flex-end;gap:3px;height:20px}
.eq i{display:block;width:4px;background:#1b1d4c;border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:5px}50%{height:19px}}
.mspin{width:18px;height:18px;border-radius:50%;border:3px solid #1b1d4c;border-top-color:transparent;animation:spin .8s linear infinite}
.langsw .musicbtn{width:40px;height:40px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.offbar{position:absolute;left:0;right:0;top:100%;z-index:6;background:#fff3cd;color:#5c4400;border-bottom:3px solid var(--ink);font-weight:800;font-size:.85rem;text-align:center;padding:3px 8px}
.hud{position:relative}
.pop .panel.sheet{width:min(100%,560px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;text-align:start;padding:16px 16px 18px;overscroll-behavior:contain}
.qs-head{display:flex;align-items:center;gap:12px;margin:-2px 30px 8px 0}
:root:lang(ar) .qs-head{margin:-2px 0 8px 30px}
.qs-icon{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:2.3rem;background:linear-gradient(#e8eeff,#c6d2fb);border:3px solid var(--ink)}
.qs-title{flex:1;min-width:0}
.qs-title h2{margin:0;font-size:1.55rem;line-height:1.05;color:var(--gold-d);text-shadow:0 2px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink)}
.qs-tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.qs-pts{flex:none;font-size:1.3rem}
.qs-lead{font-weight:800;font-size:1.08rem;margin:6px 0 10px}
.qs-sec{border-top:2px dashed var(--line);padding:8px 0}
.qs-sec h3{margin:0 0 3px;font:400 1.05rem var(--game);color:var(--navy)}
.qs-sec div{font-weight:700;line-height:1.35}
.qs-sec small{color:var(--muted);font-weight:700}
.qs-steps{margin:2px 0 0;padding-inline-start:1.3em;display:grid;gap:3px;font-weight:700}
.qs-status{border-radius:14px;padding:10px 12px;font-weight:700;margin:4px 0 10px;border:3px solid var(--ink)}
.qs-status.ok{background:#e3f9e7}.qs-status.wait{background:#fff4d6}.qs-status.no{background:#ffe9ec}.qs-status.taken{background:#eceffa}.qs-status.info{background:#e8f6ff}
.qs-foot{display:flex;justify-content:center;padding-top:8px}
.qs-cta{width:100%}
.qs-sent{text-align:center;display:grid;gap:12px;justify-items:center}
.qs-form{display:grid;gap:8px}
.qf-l{font-weight:800;color:var(--navy);font-size:1rem}
.qs-form textarea{width:100%;min-height:110px;resize:vertical;font:700 1rem/1.35 var(--body);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:#fff}
.qs-form textarea:focus,.qs-form .inp:focus{outline:4px solid var(--cyan);outline-offset:1px}
.qf-cnt{font-size:.85rem;font-weight:800;color:var(--orange);min-height:1.1em}
.qf-cnt.ok{color:var(--green-d)}
.qf-who{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.qf-who legend{margin-bottom:6px}
.qf-who .chip{display:flex;align-items:center;gap:6px;cursor:pointer}
.qf-who .chip.on{background:linear-gradient(#ffe06a,#ffb800)}
.qf-who input{width:20px;height:20px;accent-color:var(--navy)}
.qf-photo{display:grid;gap:6px;justify-items:start}
.qf-photo img{max-width:160px;max-height:120px;border-radius:12px;border:3px solid var(--ink)}
.qf-honest{display:flex;gap:10px;align-items:flex-start;font-weight:800;background:#f1f4ff;border-radius:12px;padding:10px;cursor:pointer}
.qf-honest input{flex:none;width:24px;height:24px;margin-top:1px;accent-color:var(--green-d)}
.hatline.small span{font-size:.88rem}
.linkbtn.dark{color:var(--navy);text-shadow:none}
.gbtn.orange{background:linear-gradient(#ffb15a,#ef7a06)}
.qcard2.declined{background:linear-gradient(#fff4ea,#ffe2c7)}
.cad-all{background:#5b3fd6}
/* readable badges: at least 4.5:1 with white text */
.cad-daily{background:#0b66b3}.cad-weekly{background:#1a7f37}.cad-monthly{background:#7a2fd0}.cad-special{background:#b8005f}.cad-race{background:#b84200}
.tag{text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink)}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:12px}}

.fi .p,.announce .an-row .p{background:#15803d}
.fi .p.neg{background:#b91c1c}
.fi .p.q{background:#be0068}

/* ---- v6: smart boards and split screens ---- */
#app{zoom:var(--z,1)}
.big .pop .panel,.big .toasts,.big .announce,.big .welcome .wcard,.big .tut .say,.big .picker{zoom:var(--z,1)}
@media (max-height:640px){
  .login .crest-ring,.login .tagline,.login-school{display:none}
  .login .logo{font-size:2.4rem}
  .login-main{gap:10px;padding-top:8px}
  .login{gap:8px;padding-top:10px}
  .scene.tall{height:max(250px,calc(100% - 140px))}
  .hud{padding-top:6px;padding-bottom:6px}
  .dock{padding-top:4px;padding-bottom:4px}
  .dk .di{font-size:1.5rem}.dk.home .di{font-size:1.9rem}.dk .dl{font-size:.75rem}
  .side{top:64px;width:60px;padding:4px 0}.side .si{font-size:1.5rem}
  .ribbon{top:6px;padding:4px 26px}.house-chip{top:52px}
  .pedestal{bottom:8%}.pedestal svg{width:110px;height:auto}
  .trophy-big .n{font-size:1.7rem}
  .hatnote{display:none}
  .pop .panel.sheet{max-height:calc(100vh - 16px)}
  .pop{padding:8px}
}

/* v6.1 recurring rewards */
.reppanel{padding:10px 12px}
.rep-h{color:var(--magenta);font-weight:900;font-size:1.05rem;margin-bottom:4px}
.reprow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:6px 0;text-align:start;font:inherit;color:inherit;cursor:pointer}
.reprow+.reprow{border-top:2px dashed #dfe4f5}
.rep-i{position:relative;flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem;background:linear-gradient(#fff,#ffe9f6);box-shadow:0 3px 0 var(--ink),inset 0 0 0 3px var(--magenta)}
.rep-n{position:absolute;top:-8px;inset-inline-end:-10px;background:var(--magenta);color:#fff;font-size:.78rem;border-radius:99px;padding:1px 6px;box-shadow:0 2px 0 var(--ink)}
.rep-b{flex:1;min-width:0}
.rep-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rep-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-t small{color:var(--muted,#5b6386);font-weight:800;white-space:nowrap}
.reprow .xp{margin-top:4px}
.unl-list{display:grid;gap:6px;margin:8px 0;max-height:40vh;overflow:auto;text-align:start}
.unl-list>div{display:flex;align-items:center;gap:10px;background:#f4f7ff;border-radius:12px;padding:6px 10px;font-weight:800}
.unl-list>div>span:first-child{font-size:1.5rem}
.unl-list b{flex:1}
.rep-b,.reprow .xp{display:block}
.rep-i,.rep-b,.rep-t{pointer-events:none}
.whotabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e3e9ff;border-radius:16px;padding:5px;margin-bottom:10px}
.whotabs button{border:0;border-radius:12px;padding:10px 6px;font:inherit;font-weight:900;font-size:1.05rem;color:var(--navy);background:transparent;cursor:pointer;min-height:48px}
.whotabs button.on{background:#fff;box-shadow:0 3px 0 var(--ink)}

/* v6.2 class-screen first launch */
.stage.ob{z-index:46}
.ob-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4vh,26px);padding:clamp(16px,3vh,40px) 16px;text-align:center;position:relative}
.ob-skip{position:absolute;top:12px;inset-inline-end:14px;background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:99px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
.ob-title{font-size:clamp(1.6rem,4.6vmin,3rem);color:#fff;margin:0}
.ob-sub{color:#dfe5ff;font-weight:800;font-size:clamp(1rem,2.4vmin,1.4rem);margin:4px 0 0}
.ob-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vw,24px);width:min(1100px,100%)}
.ob-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:clamp(18px,3vh,30px) 14px 16px}
.ob-step b{font-size:clamp(1.05rem,2.6vmin,1.6rem);color:var(--navy)}
.ob-step p{margin:0;font-weight:700;color:var(--muted);font-size:clamp(.92rem,2vmin,1.2rem);line-height:1.3}
.ob-n{position:absolute;top:-22px;left:50%;margin-left:-24px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--magenta);color:#fff;font-size:1.6rem;box-shadow:0 4px 0 var(--ink);border:3px solid var(--ink)}
.ob-i{font-size:clamp(2.6rem,7vmin,4.4rem);line-height:1.1;margin-top:10px}
.ob-bubble{max-width:min(760px,92vw);font-size:clamp(1.25rem,3.4vmin,2.2rem)!important;line-height:1.25}
.ob-hat{animation:obfloat 3s ease-in-out infinite;transform-origin:50% 80%}
.ob-hat svg{width:clamp(170px,32vmin,300px);height:auto}
.ob-hat.small svg{width:clamp(120px,20vmin,200px)}
@keyframes obfloat{0%,100%{translate:0 0}50%{translate:0 -12px}}
.ob-choose-h{display:flex;align-items:center;gap:12px;text-align:start}
.ob-minihat svg{width:84px;height:auto}
.ob-cards{width:min(900px,100%);grid-template-columns:repeat(4,minmax(0,1fr))}
.ob-go{min-width:min(420px,90%)}
.ob-go[disabled]{opacity:.6}
.ob-confirm{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;max-width:560px;border:4px solid var(--hc)}
.ob-confirm h2{margin:0;font-size:clamp(1.4rem,4vmin,2.2rem)}
.ob-confirm p{margin:0;font-weight:800;color:var(--muted)}
#ob-end{min-height:70px}
@media (max-width:700px){.ob-steps{grid-template-columns:1fr;gap:26px}.ob-cards{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.ob-hat{animation:none}}
.choose-cta{width:100%;background:linear-gradient(#ff7ac6,#e4007e)!important}
/* across Waad */
.feed2{padding:10px 12px}
.f2-h{font-weight:900;color:var(--magenta);font-size:1.1rem;margin-bottom:6px}
.f2-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.f2-cols{grid-template-columns:1fr}}
.f2-t{font-weight:900;color:var(--navy);margin-bottom:4px}
.fr{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:2px dashed #e3e8f8}
.fr.me{background:#fff6d6;border-radius:10px;padding-inline:6px}
.fr svg{flex:none}
.fr-b{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.fr-b b{font-size:.92rem}
.fr-b span{font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr small{color:var(--muted);font-weight:800;font-size:.78rem;white-space:nowrap}
.fr i{font-style:normal}
.fr i.p{color:var(--green-d);font-weight:900}
.fr i.st{color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem;font-weight:900}
.f2-e{margin:4px 0;font-size:.9rem}
.f2-cols>div{min-width:0}

/* v6.3 official house marks: the "epic" badge (aura + motion around the unchanged logo) */
.crest-epic{position:relative;display:inline-grid;place-items:center;isolation:isolate;vertical-align:middle}
.crest-epic>svg{position:relative;z-index:2;animation:ceFloat 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(27,29,76,.35))}
.ce-aura{position:absolute;inset:-38%;border-radius:50%;z-index:0;background:radial-gradient(circle,var(--hc) 0%,var(--hc) 22%,transparent 66%);filter:blur(8px);opacity:.6;animation:cePulse 2.6s ease-in-out infinite}
.ce-rays{position:absolute;inset:-70%;z-index:1;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.42) 0 6deg,transparent 6deg 20deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:spin 18s linear infinite;opacity:.55;pointer-events:none}
.ce-shine{position:absolute;inset:3%;border-radius:24%;overflow:hidden;z-index:3;pointer-events:none;animation:ceFloat 3.2s ease-in-out infinite}
.ce-shine::after{content:"";position:absolute;top:-30%;bottom:-30%;width:34%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-18deg);animation:ceShine 4.2s ease-in-out infinite}
@keyframes ceShine{0%,58%{left:-70%}82%,100%{left:140%}}
@keyframes cePulse{0%,100%{transform:scale(.9);opacity:.45}50%{transform:scale(1.1);opacity:.8}}
@keyframes ceFloat{0%,100%{translate:0 0}50%{translate:0 -7px}}
.pedestal .crest-big{animation:none}
@media (prefers-reduced-motion:reduce){.crest-epic>svg,.ce-aura,.ce-rays,.ce-shine,.ce-shine::after{animation:none}}

</style>
